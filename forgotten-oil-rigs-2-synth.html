<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgotten Oil Rigs 2 Wind Synth</title>
  <style>
    :root{--panel:rgba(38,29,18,.9);--panel2:rgba(58,42,24,.92);--text:#fff0d2;--muted:#d6b47a;--line:rgba(232,184,104,.24);--sand:#e6b861;--rust:#9f4c2f}*{box-sizing:border-box}
    body{margin:0;min-height:100vh;font-family:Georgia,serif;color:var(--text);background:radial-gradient(circle at 24% 18%,rgba(230,184,97,.22),transparent 28%),radial-gradient(circle at 78% 64%,rgba(138,199,255,.12),transparent 34%),linear-gradient(140deg,#080604,#26170b 52%,#4e2b14);overflow-x:hidden}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(105deg,transparent 0 13px,rgba(255,232,178,.05) 13px 15px,transparent 15px 36px);opacity:.6;animation:sand 18s linear infinite}@keyframes sand{from{transform:translateX(-60px)}to{transform:translateX(60px)}}
    main{width:min(1180px,calc(100% - 32px));margin:0 auto;padding:28px 0 44px}.home-link{display:inline-block;margin-bottom:18px;color:var(--muted);text-decoration:none;font:12px Arial,sans-serif;letter-spacing:.16em;text-transform:uppercase}h1{margin:0;font-size:clamp(31px,6vw,76px);line-height:.92;letter-spacing:-.055em;text-transform:uppercase;text-shadow:0 0 22px rgba(230,184,97,.32)}.subtitle{max-width:840px;color:var(--muted);line-height:1.5;font-family:Arial,sans-serif}.layout{display:grid;grid-template-columns:1.08fr .92fr;gap:18px}@media(max-width:920px){.layout{grid-template-columns:1fr}}
    .panel{border:1px solid var(--line);border-radius:22px;background:var(--panel);box-shadow:0 28px 90px rgba(0,0,0,.44),inset 0 0 50px rgba(230,184,97,.035);backdrop-filter:blur(12px);padding:18px}.play-dock{position:sticky;top:10px;z-index:10;display:grid;gap:10px;margin-bottom:16px}button{border:1px solid var(--line);border-radius:14px;background:linear-gradient(180deg,rgba(105,70,35,.96),rgba(36,25,15,.96));color:var(--text);cursor:pointer;font:14px Arial,sans-serif;padding:12px 14px}button:hover{border-color:rgba(230,184,97,.78);box-shadow:0 0 22px rgba(230,184,97,.15)}.big-play{padding:18px;font-size:20px;font-weight:700;background:linear-gradient(180deg,rgba(159,76,47,.94),rgba(52,34,19,.98))}
    .utility-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}@media(max-width:680px){.controls,.utility-row{grid-template-columns:1fr}}.control{background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:12px}label{display:flex;justify-content:space-between;gap:12px;margin-bottom:8px;color:var(--muted);font:12px Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase}input,select{width:100%;accent-color:var(--sand)}select{padding:10px;border-radius:12px;border:1px solid var(--line);background:#1a1008;color:var(--text);font:14px Arial,sans-serif}
    canvas{width:100%;height:280px;display:block;border-radius:18px;border:1px solid var(--line);background:#080604}.readout{min-height:172px;margin-top:14px;padding:14px;border-radius:16px;border:1px solid var(--line);background:rgba(14,9,5,.76);color:var(--muted);line-height:1.45;white-space:pre-line;font-family:"Courier New",monospace}.preset-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}@media(max-width:620px){.preset-row{grid-template-columns:1fr}}.preset{text-align:left;min-height:76px}.preset strong{display:block;color:#fff;margin-bottom:5px;font-family:Georgia,serif}.preset span{display:block;color:var(--muted);font-size:12px;line-height:1.35}
  </style>
</head>
<body>
  <main><a class="home-link" href="index.html">← Radwalls</a><header><h1>Oil Rigs 2 Synth</h1><p class="subtitle">Chosen style: granular desert wind and sand noise, narrow whistles, corroded radio delay, and distant fairy voices bent until they feel half-real.</p></header>
    <div class="layout"><section class="panel"><div class="play-dock"><button class="big-play" id="playButton">Start Desert Signal</button><div class="utility-row"><button id="randomButton">Randomize</button><button id="gustButton">Add Gust</button><button id="exportButton">Export .wav</button></div></div><div class="controls" id="controls"></div></section><aside class="panel"><canvas id="scope" width="900" height="360"></canvas><div class="readout" id="readout"></div><div class="preset-row" id="presetRow"></div></aside></div>
  </main>
  <script>
    const spec=[["wind","Wind Bed",0,1,.01],["sand","Sand Grain",0,1,.01],["whistle","Whistle",0,1,.01],["fairy","Distant Fairies",0,1,.01],["distort","Distortion",0,1,.01],["drift","Pitch Drift",0,1,.01],["radio","Distant Radio",0,1,.01],["space","Empty Space",0,1,.01],["rig","Rig Metal",0,1,.01]], modes=["dune","rig","mirage","storm"]; let p={wind:.62,sand:.38,whistle:.34,fairy:.28,distort:.22,drift:.42,radio:.34,space:.58,rig:.2,mode:"dune"}, ac, master, analyser, nodes={}, fairies=[], playing=false, raf=0;
    const presets=[["Low Dunes","dry wind, light sand, almost no voices",{wind:.62,sand:.28,whistle:.18,fairy:.08,distort:.12,drift:.34,radio:.18,space:.62,rig:.12,mode:"dune"}],["Distorted Fairies","far away voices through broken air",{wind:.42,sand:.22,whistle:.52,fairy:.82,distort:.56,drift:.72,radio:.48,space:.8,rig:.18,mode:"mirage"}],["Rig Skeleton","metal groans in a hot offshore wind",{wind:.52,sand:.18,whistle:.26,fairy:.2,distort:.42,drift:.38,radio:.5,space:.52,rig:.76,mode:"rig"}],["White Sandstorm","dense sand, hard whistles, low visibility",{wind:.9,sand:.86,whistle:.72,fairy:.24,distort:.38,drift:.8,radio:.34,space:.48,rig:.36,mode:"storm"}]];
    const cv=scope,cx=cv.getContext("2d"); spec.forEach(s=>controls.insertAdjacentHTML("beforeend",`<div class="control"><label for="${s[0]}">${s[1]} <span data-v="${s[0]}"></span></label><input id="${s[0]}" type="range" min="${s[2]}" max="${s[3]}" step="${s[4]}"></div>`)); controls.insertAdjacentHTML("beforeend",`<div class="control"><label for="mode">Landscape</label><select id="mode">${modes.map(m=>`<option value="${m}">${m}</option>`).join("")}</select></div>`);
    function noise(c,s=2){const b=c.createBuffer(1,c.sampleRate*s,c.sampleRate),d=b.getChannelData(0);let last=0;for(let i=0;i<d.length;i++){last=last*.985+(Math.random()*2-1)*.015;d[i]=last+(Math.random()*2-1)*.08}return b} function curve(a){const c=new Float32Array(2048),k=1+a*110;for(let i=0;i<c.length;i++){const x=i*2/c.length-1;c[i]=Math.tanh(k*x)/Math.tanh(k)}return c} function imp(c,s,d){const b=c.createBuffer(2,c.sampleRate*s,c.sampleRate);for(let ch=0;ch<2;ch++){const data=b.getChannelData(ch);for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*Math.pow(1-i/data.length,d)}return b} function base(){return p.mode==="rig"?146:p.mode==="mirage"?493.88:p.mode==="storm"?311.13:220}
    function apply(){document.querySelectorAll("input,select").forEach(e=>e.value=p[e.id]);document.querySelectorAll("[data-v]").forEach(e=>e.textContent=Math.round(p[e.dataset.v]*100)+"%"); if(ac){master.gain.setTargetAtTime(.72,ac.currentTime,.04);nodes.wf.frequency.setTargetAtTime(180+p.wind*1450,ac.currentTime,.05);nodes.wf.Q.setTargetAtTime(.4+p.wind*1.8,ac.currentTime,.05);nodes.sf.frequency.setTargetAtTime(1800+p.sand*9200,ac.currentTime,.05);nodes.sf.Q.setTargetAtTime(2+p.sand*14,ac.currentTime,.05);nodes.wh.frequency.setTargetAtTime(base()*(2.5+p.drift*3.5),ac.currentTime,.05);nodes.wh.detune.setTargetAtTime(80*p.drift,ac.currentTime,.05);nodes.wg.gain.setTargetAtTime(p.whistle*.13,ac.currentTime,.05);nodes.fg.gain.setTargetAtTime(p.fairy*.13,ac.currentTime,.05);nodes.rig.frequency.setTargetAtTime(36+p.rig*80,ac.currentTime,.05);nodes.rg.gain.setTargetAtTime(p.rig*.18,ac.currentTime,.05);nodes.d.delayTime.setTargetAtTime(.12+p.radio*.72,ac.currentTime,.05);nodes.dw.gain.setTargetAtTime(p.radio*.46,ac.currentTime,.05);nodes.fb.gain.setTargetAtTime(.12+p.radio*.54,ac.currentTime,.05);nodes.rw.gain.setTargetAtTime(p.space*.7,ac.currentTime,.05);nodes.sh.curve=curve(p.distort);fairies.forEach((v,i)=>{v.frequency.setTargetAtTime(base()*[1.5,2.01,2.98,4.04][i],ac.currentTime,.05);v.detune.setTargetAtTime((i-1.5)*21+p.drift*180,ac.currentTime,.05)})} readout.textContent=`STYLE\nWind, sand, whistles, distorted distant fairies.\n\nCURRENT PATCH\n${p.mode}\nWind ${Math.round(p.wind*100)}%\nSand ${Math.round(p.sand*100)}%\nFairies ${Math.round(p.fairy*100)}%\nRadio delay ${Math.round(p.radio*100)}%\n\nUSE\nLow wind: empty travel, lost beach, rig distance.\nHigh sand + whistle: danger, bad weather, mirage scenes.`}
    async function start(){if(!ac){ac=new(AudioContext||webkitAudioContext)();master=ac.createGain();analyser=ac.createAnalyser();analyser.fftSize=2048;nodes.sh=ac.createWaveShaper();nodes.wf=ac.createBiquadFilter();nodes.wf.type="bandpass";nodes.sf=ac.createBiquadFilter();nodes.sf.type="highpass";nodes.wh=ac.createOscillator();nodes.wh.type="sine";nodes.wg=ac.createGain();nodes.fg=ac.createGain();nodes.rig=ac.createOscillator();nodes.rig.type="sawtooth";nodes.rg=ac.createGain();nodes.d=ac.createDelay(1.2);nodes.dw=ac.createGain();nodes.fb=ac.createGain();nodes.rv=ac.createConvolver();nodes.rv.buffer=imp(ac,3.2,2.1);nodes.rw=ac.createGain();const w=ac.createBufferSource(),s=ac.createBufferSource();w.buffer=noise(ac,3);s.buffer=noise(ac,1);w.loop=s.loop=true;w.connect(nodes.wf);s.connect(nodes.sf);nodes.wf.connect(master);nodes.sf.connect(master);nodes.wh.connect(nodes.wg);nodes.wg.connect(master);for(let i=0;i<4;i++){const v=ac.createOscillator();v.type=i%2?"triangle":"sine";v.connect(nodes.fg);v.start();fairies.push(v)}nodes.fg.connect(nodes.sh);nodes.rig.connect(nodes.rg);nodes.rg.connect(nodes.sh);nodes.sh.connect(master);master.connect(nodes.d);nodes.d.connect(nodes.fb);nodes.fb.connect(nodes.d);nodes.d.connect(nodes.dw);nodes.dw.connect(master);master.connect(nodes.rv);nodes.rv.connect(nodes.rw);nodes.rw.connect(analyser);master.connect(analyser);analyser.connect(ac.destination);w.start();s.start();nodes.wh.start();nodes.rig.start()}if(ac.state==="suspended")await ac.resume();playing=true;playButton.textContent="Stop Desert Signal";apply();draw()}
    function stop(){playing=false;playButton.textContent="Start Desert Signal";if(master)master.gain.setTargetAtTime(.0001,ac.currentTime,.03);setTimeout(()=>{if(master)master.gain.value=.72},120);cancelAnimationFrame(raf)} function draw(){if(!playing)return;const a=new Uint8Array(analyser.frequencyBinCount);analyser.getByteTimeDomainData(a);cx.fillStyle="#080604";cx.fillRect(0,0,cv.width,cv.height);cx.strokeStyle="rgba(230,184,97,.78)";cx.beginPath();a.forEach((v,i)=>{const x=i/(a.length-1)*cv.width,y=v/255*cv.height;i?cx.lineTo(x,y):cx.moveTo(x,y)});cx.stroke();raf=requestAnimationFrame(draw)}
    function set(x){p={...p,...x};apply()} document.querySelectorAll("input,select").forEach(e=>e.addEventListener("input",()=>{p[e.id]=e.type==="range"?Number(e.value):e.value;apply()})); playButton.onclick=()=>playing?stop():start(); randomButton.onclick=()=>set({wind:.25+Math.random()*.75,sand:Math.random(),whistle:Math.random(),fairy:Math.random(),distort:Math.random()*.85,drift:Math.random(),radio:Math.random(),space:.24+Math.random()*.76,rig:Math.random(),mode:modes[Math.floor(Math.random()*modes.length)]}); gustButton.onclick=()=>set({wind:Math.min(1,p.wind+.16),sand:Math.min(1,p.sand+.14),whistle:Math.min(1,p.whistle+.08)});
    function renderExport(){const sr=ac?.sampleRate||48000,dur=7,o=new OfflineAudioContext(2,sr*dur,sr),out=o.createGain(),sh=o.createWaveShaper(),wf=o.createBiquadFilter(),sf=o.createBiquadFilter(),del=o.createDelay(1.2),fb=o.createGain(),dw=o.createGain(),rv=o.createConvolver(),rw=o.createGain();out.gain.value=.72;sh.curve=curve(p.distort);wf.type="bandpass";wf.frequency.value=180+p.wind*1450;wf.Q.value=.4+p.wind*1.8;sf.type="highpass";sf.frequency.value=1800+p.sand*9200;sf.Q.value=2+p.sand*14;const w=o.createBufferSource(),s=o.createBufferSource();w.buffer=noise(o,dur);s.buffer=noise(o,dur);w.connect(wf);s.connect(sf);wf.connect(out);sf.connect(out);const wh=o.createOscillator(),wg=o.createGain(),b=base();wh.type="sine";wh.frequency.value=b*(2.5+p.drift*3.5);wh.detune.value=80*p.drift;wg.gain.value=p.whistle*.13;wh.connect(wg);wg.connect(out);for(let i=0;i<4;i++){const v=o.createOscillator(),g=o.createGain();v.type=i%2?"triangle":"sine";v.frequency.value=b*[1.5,2.01,2.98,4.04][i];v.detune.value=(i-1.5)*21+p.drift*180;g.gain.value=p.fairy*.032;v.connect(g);g.connect(sh);v.start();v.stop(dur)}const ro=o.createOscillator(),rg=o.createGain();ro.type="sawtooth";ro.frequency.value=36+p.rig*80;rg.gain.value=p.rig*.18;ro.connect(rg);rg.connect(sh);sh.connect(out);del.delayTime.value=.12+p.radio*.72;fb.gain.value=.12+p.radio*.54;dw.gain.value=p.radio*.46;rv.buffer=imp(o,3.2,2.1);rw.gain.value=p.space*.7;out.connect(del);del.connect(fb);fb.connect(del);del.connect(dw);dw.connect(out);out.connect(rv);rv.connect(rw);rw.connect(o.destination);out.connect(o.destination);w.start();s.start();wh.start();ro.start();w.stop(dur);s.stop(dur);wh.stop(dur);ro.stop(dur);return o.startRendering()} function wav(b){const l=b.length*b.numberOfChannels*2+44,v=new DataView(new ArrayBuffer(l)),w=(o,s)=>[...s].forEach((c,i)=>v.setUint8(o+i,c.charCodeAt(0)));w(0,"RIFF");v.setUint32(4,l-8,true);w(8,"WAVE");w(12,"fmt ");v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,b.numberOfChannels,true);v.setUint32(24,b.sampleRate,true);v.setUint32(28,b.sampleRate*b.numberOfChannels*2,true);v.setUint16(32,b.numberOfChannels*2,true);v.setUint16(34,16,true);w(36,"data");v.setUint32(40,l-44,true);let o=44;for(let i=0;i<b.length;i++)for(let ch=0;ch<b.numberOfChannels;ch++){const s=Math.max(-1,Math.min(1,b.getChannelData(ch)[i]));v.setInt16(o,s<0?s*32768:s*32767,true);o+=2}return new Blob([v],{type:"audio/wav"})} exportButton.onclick=async()=>{const b=await renderExport(),a=document.createElement("a");a.href=URL.createObjectURL(wav(b));a.download=`forgotten-oil-rigs-2-synth-${Date.now()}.wav`;a.click();URL.revokeObjectURL(a.href)};
    presets.forEach(([n,t,pa])=>{const b=document.createElement("button");b.className="preset";b.innerHTML=`<strong>${n}</strong><span>${t}</span>`;b.onclick=()=>set(pa);presetRow.appendChild(b)});apply();
  </script>
</body>
