<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Atrium Glass Corruption Synth</title>
  <style>
    :root{--bg:#06100f;--panel:rgba(9,23,21,.9);--panel2:rgba(15,38,35,.92);--text:#eafff8;--muted:#91d8c8;--line:rgba(112,255,218,.24);--hot:#45ffc5;--violet:#a98cff}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;font-family:"Courier New",monospace;color:var(--text);background:radial-gradient(circle at 48% 15%,rgba(69,255,197,.16),transparent 27%),radial-gradient(circle at 83% 72%,rgba(169,140,255,.16),transparent 31%),linear-gradient(145deg,#020605,#06100f 56%,#121022);overflow-x:hidden}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 5px),linear-gradient(90deg,transparent 0 48%,rgba(69,255,197,.07) 49% 51%,transparent 52%);opacity:.45}
    main{width:min(1180px,calc(100% - 32px));margin:0 auto;padding:28px 0 44px}.home-link{display:inline-block;margin-bottom:18px;color:var(--muted);text-decoration:none;font-size:12px;letter-spacing:.16em;text-transform:uppercase}
    h1{margin:0;font-size:clamp(31px,6vw,72px);line-height:.9;letter-spacing:-.07em;text-transform:uppercase;text-shadow:0 0 22px rgba(69,255,197,.45)}.subtitle{max-width:850px;color:var(--muted);line-height:1.5}.layout{display:grid;grid-template-columns:1.08fr .92fr;gap:18px}@media(max-width:920px){.layout{grid-template-columns:1fr}}
    .panel{border:1px solid var(--line);border-radius:22px;background:var(--panel);box-shadow:0 28px 90px rgba(0,0,0,.42),inset 0 0 44px rgba(69,255,197,.04);backdrop-filter:blur(12px);padding:18px}.play-dock{position:sticky;top:10px;z-index:10;display:grid;gap:10px;margin-bottom:16px}
    button{border:1px solid var(--line);border-radius:14px;background:linear-gradient(180deg,rgba(36,82,75,.94),rgba(8,19,18,.94));color:var(--text);cursor:pointer;font:inherit;padding:12px 14px}button:hover{border-color:rgba(69,255,197,.75);box-shadow:0 0 22px rgba(69,255,197,.16)}.big-play{padding:18px;font-size:20px;font-weight:700;background:linear-gradient(180deg,rgba(69,255,197,.36),rgba(17,32,33,.98))}
    .utility-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}@media(max-width:680px){.controls,.utility-row{grid-template-columns:1fr}}
    .control{background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:12px}label{display:flex;justify-content:space-between;gap:12px;margin-bottom:8px;color:var(--muted);font-size:12px;letter-spacing:.08em;text-transform:uppercase}input,select{width:100%;accent-color:var(--hot)}select{padding:10px;border-radius:12px;border:1px solid var(--line);background:#06110f;color:var(--text);font:inherit}
    canvas{width:100%;height:280px;display:block;border-radius:18px;border:1px solid var(--line);background:#010403}.readout{min-height:172px;margin-top:14px;padding:14px;border-radius:16px;border:1px solid var(--line);background:rgba(2,7,6,.76);color:var(--muted);line-height:1.45;white-space:pre-line}.preset-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}@media(max-width:620px){.preset-row{grid-template-columns:1fr}}.preset{text-align:left;min-height:76px}.preset strong{display:block;color:#fff;margin-bottom:5px}.preset span{display:block;color:var(--muted);font-size:12px;line-height:1.35}
  </style>
</head>
<body>
  <main>
    <a class="home-link" href="index.html">← Radwalls</a>
    <header><h1>Atrium Synth</h1><p class="subtitle">Chosen style: clean glass FM and organ-like pads, with corruption that folds pitch, smears the room, and lets green digital damage creep in.</p></header>
    <div class="layout">
      <section class="panel">
        <div class="play-dock"><button class="big-play" id="playButton">Start Atrium Signal</button><div class="utility-row"><button id="randomButton">Randomize</button><button id="mutateButton">Corrupt Slightly</button><button id="exportButton">Export .wav</button></div></div>
        <div class="controls" id="controls"></div>
      </section>
      <aside class="panel"><canvas id="scope" width="900" height="360"></canvas><div class="readout" id="readout"></div><div class="preset-row" id="presetRow"></div></aside>
    </div>
  </main>
  <script>
    const spec=[["root","Root Pitch",48,84,1],["spread","Glass Spread",0,1,.01],["choir","Choir Layer",0,1,.01],["corrupt","Corruption",0,1,.01],["jitter","Pitch Jitter",0,1,.01],["filter","Light Filter",0,1,.01],["delay","Echo Memory",0,1,.01],["room","Atrium Room",0,1,.01],["pulse","Green Pulse",0,1,.01]];
    const modes=["glass","choir","elevator","broken"], defaults={root:64,spread:.42,choir:.34,corrupt:.18,jitter:.12,filter:.62,delay:.38,room:.58,pulse:.26,mode:"glass"}; let p={...defaults}, ac, master, analyser, voices=[], nodes={}, playing=false, raf=0;
    const presets=[["Clean Atrium","bright glass tones, barely damaged",{root:67,spread:.38,choir:.25,corrupt:.06,jitter:.05,filter:.72,delay:.28,room:.42,pulse:.18,mode:"glass"}],["Green Fault","clean body with corrupt signal riding it",{root:61,spread:.5,choir:.34,corrupt:.48,jitter:.36,filter:.55,delay:.48,room:.62,pulse:.54,mode:"broken"}],["Pre-Labs Choir","soft organ pad through a cold room",{root:57,spread:.29,choir:.78,corrupt:.16,jitter:.11,filter:.5,delay:.34,room:.8,pulse:.14,mode:"choir"}],["Elevator Afterimage","rising metallic shimmer and delay",{root:72,spread:.68,choir:.18,corrupt:.28,jitter:.22,filter:.83,delay:.66,room:.52,pulse:.42,mode:"elevator"}]];
    const controls=document.getElementById("controls"), cv=document.getElementById("scope"), cx=cv.getContext("2d"), readout=document.getElementById("readout");
    spec.forEach(s=>controls.insertAdjacentHTML("beforeend",`<div class="control"><label for="${s[0]}">${s[1]} <span data-v="${s[0]}"></span></label><input id="${s[0]}" type="range" min="${s[2]}" max="${s[3]}" step="${s[4]}"></div>`)); controls.insertAdjacentHTML("beforeend",`<div class="control"><label for="mode">Signal Shape</label><select id="mode">${modes.map(m=>`<option value="${m}">${m}</option>`).join("")}</select></div>`);
    function hz(n){return 440*Math.pow(2,(n-69)/12)} function curve(a){const c=new Float32Array(2048),k=1+a*90;for(let i=0;i<c.length;i++){const x=i*2/c.length-1;c[i]=Math.tanh(k*x)/Math.tanh(k)}return c} function imp(c,s,d){const b=c.createBuffer(2,c.sampleRate*s,c.sampleRate);for(let ch=0;ch<2;ch++){const data=b.getChannelData(ch);for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*Math.pow(1-i/data.length,d)}return b} function ratios(){return p.mode==="choir"?[.5,1,1.005,1.5,2]:p.mode==="elevator"?[1,1.25,1.5,2.01,3.02]:p.mode==="broken"?[.51,1,1.41,1.93,2.68]:[1,1.5,2,2.5,4]}
    function apply(){document.querySelectorAll("input,select").forEach(e=>e.value=p[e.id]);document.querySelectorAll("[data-v]").forEach(e=>e.textContent=e.dataset.v==="root"?p.root:Math.round(p[e.dataset.v]*100)+"%");if(ac){const b=hz(p.root);nodes.f.frequency.setTargetAtTime(550+p.filter*5200,ac.currentTime,.04);nodes.f.Q.setTargetAtTime(1+p.corrupt*9,ac.currentTime,.04);nodes.d.delayTime.setTargetAtTime(.08+p.delay*.72,ac.currentTime,.05);nodes.dw.gain.setTargetAtTime(p.delay*.42,ac.currentTime,.04);nodes.fb.gain.setTargetAtTime(.12+p.delay*.56,ac.currentTime,.04);nodes.rw.gain.setTargetAtTime(p.room*.72,ac.currentTime,.04);nodes.pg.gain.setTargetAtTime(p.pulse*(.12+p.corrupt*.28),ac.currentTime,.04);nodes.sh.curve=curve(p.corrupt);voices.forEach((v,i)=>{v.c.frequency.setTargetAtTime(b*ratios()[i%ratios().length],ac.currentTime,.05);v.c.detune.setTargetAtTime((i-2)*p.spread*18,ac.currentTime,.05);v.m.frequency.setTargetAtTime(b*(1.5+i*.22+p.corrupt),ac.currentTime,.05);v.mg.gain.setTargetAtTime(12+p.corrupt*180+p.jitter*60,ac.currentTime,.05);v.g.gain.setTargetAtTime(i>2?p.choir*.12:.1,ac.currentTime,.05)})}readout.textContent=`STYLE\nClean Atrium glass, hollow choir, controlled corruption.\n\nCURRENT PATCH\nRoot ${p.root}, ${p.mode}\nCorruption ${Math.round(p.corrupt*100)}%\nGreen pulse ${Math.round(p.pulse*100)}%\nRoom ${Math.round(p.room*100)}%\n\nUSE\nLow corruption: menu pads, labs rooms, glass UI.\nHigh corruption: state reveal, Dark One, broken Atrium events.`}
    async function start(){if(!ac){ac=new(AudioContext||webkitAudioContext)();master=ac.createGain();master.gain.value=.72;analyser=ac.createAnalyser();analyser.fftSize=2048;nodes.f=ac.createBiquadFilter();nodes.f.type="lowpass";nodes.sh=ac.createWaveShaper();nodes.d=ac.createDelay(1.2);nodes.dw=ac.createGain();nodes.fb=ac.createGain();nodes.rv=ac.createConvolver();nodes.rv.buffer=imp(ac,2.4,2.7);nodes.rw=ac.createGain();nodes.pg=ac.createGain();const mix=ac.createGain();for(let i=0;i<5;i++){const c=ac.createOscillator(),m=ac.createOscillator(),mg=ac.createGain(),g=ac.createGain();c.type=i%2?"triangle":"sine";m.connect(mg);mg.connect(c.frequency);c.connect(g);g.connect(mix);c.start();m.start();voices.push({c,m,mg,g})}const po=ac.createOscillator();po.type="sawtooth";po.frequency.value=31;po.connect(nodes.pg);nodes.pg.connect(mix);po.start();mix.connect(nodes.f);nodes.f.connect(nodes.sh);nodes.sh.connect(master);nodes.sh.connect(nodes.d);nodes.d.connect(nodes.fb);nodes.fb.connect(nodes.d);nodes.d.connect(nodes.dw);nodes.dw.connect(master);master.connect(nodes.rv);nodes.rv.connect(nodes.rw);nodes.rw.connect(analyser);master.connect(analyser);analyser.connect(ac.destination)} if(ac.state==="suspended")await ac.resume();playing=true;playButton.textContent="Stop Atrium Signal";apply();draw()}
    function stop(){playing=false;playButton.textContent="Start Atrium Signal";if(master)master.gain.setTargetAtTime(.0001,ac.currentTime,.03);setTimeout(()=>{if(master)master.gain.value=.72},120);cancelAnimationFrame(raf)}
    function draw(){if(!playing)return;const a=new Uint8Array(analyser.frequencyBinCount);analyser.getByteTimeDomainData(a);cx.fillStyle="#010403";cx.fillRect(0,0,cv.width,cv.height);cx.strokeStyle="rgba(69,255,197,.78)";cx.beginPath();a.forEach((v,i)=>{const x=i/(a.length-1)*cv.width,y=v/255*cv.height;i?cx.lineTo(x,y):cx.moveTo(x,y)});cx.stroke();raf=requestAnimationFrame(draw)}
    function set(x){p={...p,...x};apply()} document.querySelectorAll("input,select").forEach(e=>e.addEventListener("input",()=>{p[e.id]=e.type==="range"?Number(e.value):e.value;apply()})); playButton.onclick=()=>playing?stop():start(); randomButton.onclick=()=>set({root:52+Math.floor(Math.random()*29),spread:Math.random(),choir:Math.random(),corrupt:Math.random()*.72,jitter:Math.random()*.7,filter:Math.random(),delay:Math.random(),room:.2+Math.random()*.8,pulse:Math.random(),mode:modes[Math.floor(Math.random()*modes.length)]}); mutateButton.onclick=()=>set({corrupt:Math.min(1,p.corrupt+.12),jitter:Math.min(1,p.jitter+.08),pulse:Math.min(1,p.pulse+.1)});
    function renderExport(){const sr=ac?.sampleRate||48000,dur=6,o=new OfflineAudioContext(2,sr*dur,sr),out=o.createGain(),f=o.createBiquadFilter(),sh=o.createWaveShaper(),del=o.createDelay(1.2),fb=o.createGain(),dw=o.createGain(),rv=o.createConvolver(),rw=o.createGain();out.gain.value=.72;f.type="lowpass";f.frequency.value=550+p.filter*5200;f.Q.value=1+p.corrupt*9;sh.curve=curve(p.corrupt);del.delayTime.value=.08+p.delay*.72;fb.gain.value=.12+p.delay*.56;dw.gain.value=p.delay*.42;rv.buffer=imp(o,2.4,2.7);rw.gain.value=p.room*.72;const b=hz(p.root),rs=ratios();for(let i=0;i<5;i++){const c=o.createOscillator(),m=o.createOscillator(),mg=o.createGain(),g=o.createGain();c.type=i%2?"triangle":"sine";c.frequency.value=b*rs[i%rs.length];c.detune.value=(i-2)*p.spread*18;m.frequency.value=b*(1.5+i*.22+p.corrupt);mg.gain.value=12+p.corrupt*180+p.jitter*60;g.gain.value=i>2?p.choir*.12:.1;m.connect(mg);mg.connect(c.frequency);c.connect(g);g.connect(f);c.start();m.start();c.stop(dur);m.stop(dur)}const po=o.createOscillator(),pg=o.createGain();po.type="sawtooth";po.frequency.value=31;pg.gain.value=p.pulse*(.12+p.corrupt*.28);po.connect(pg);pg.connect(f);po.start();po.stop(dur);f.connect(sh);sh.connect(out);sh.connect(del);del.connect(fb);fb.connect(del);del.connect(dw);dw.connect(out);out.connect(rv);rv.connect(rw);rw.connect(o.destination);out.connect(o.destination);return o.startRendering()} function wav(b){const l=b.length*b.numberOfChannels*2+44,v=new DataView(new ArrayBuffer(l)),w=(o,s)=>[...s].forEach((c,i)=>v.setUint8(o+i,c.charCodeAt(0)));w(0,"RIFF");v.setUint32(4,l-8,true);w(8,"WAVE");w(12,"fmt ");v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,b.numberOfChannels,true);v.setUint32(24,b.sampleRate,true);v.setUint32(28,b.sampleRate*b.numberOfChannels*2,true);v.setUint16(32,b.numberOfChannels*2,true);v.setUint16(34,16,true);w(36,"data");v.setUint32(40,l-44,true);let o=44;for(let i=0;i<b.length;i++)for(let ch=0;ch<b.numberOfChannels;ch++){const s=Math.max(-1,Math.min(1,b.getChannelData(ch)[i]));v.setInt16(o,s<0?s*32768:s*32767,true);o+=2}return new Blob([v],{type:"audio/wav"})} exportButton.onclick=async()=>{const b=await renderExport(),a=document.createElement("a");a.href=URL.createObjectURL(wav(b));a.download=`atrium-synth-${Date.now()}.wav`;a.click();URL.revokeObjectURL(a.href)};
    presets.forEach(([n,t,pa])=>{const b=document.createElement("button");b.className="preset";b.innerHTML=`<strong>${n}</strong><span>${t}</span>`;b.onclick=()=>set(pa);presetRow.appendChild(b)});apply();
  </script>
</body>
</html>
